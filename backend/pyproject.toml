[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentus-network"
version = "0.1.0"
description = "Local agent-network app: loopback API, persistence, runtime, optional WebView2 host"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "mcp>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
